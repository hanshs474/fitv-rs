[package]
name = "freeimagetovideo"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Free image to video AI with no daily cap: start with no sign-up, keep going on a free account. Every video comes with sound and no watermark. This is the official Rust SDK for Free Image to Video."
license = "MIT"
authors = ["Free Image to Video <support@freeimagetovideo.ai>"]
readme = "README.md"
homepage = "https://freeimagetovideo.ai/?utm_source=crates.io&utm_medium=package"
repository = "https://github.com/hanshs474/fitv-rs"
documentation = "https://docs.rs/freeimagetovideo"
keywords = ["image-to-video", "text-to-video", "video-generation", "ai", "minimax"]
categories = ["api-bindings", "multimedia::video"]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
